services:
  db:
    image: 'postgres:15-alpine'
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${DB_NAME}'
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'paros_postgres_data:/var/lib/postgresql/data'
    expose:
      - '5432'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${DB_USER} -d ${DB_NAME}'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py compilemessages &&
             python manage.py crear_superusuario &&
             gunicorn paros_project.wsgi:application \
             --bind 0.0.0.0:8000 \
             --worker-class gthread \
             --workers 3 --threads 4 \
             --worker-tmp-dir /dev/shm \
             --timeout 120 \
             --graceful-timeout 30 \
             --max-requests 1000 \
             --max-requests-jitter 100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/login/')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - 'paros_static_volume:/app/staticfiles'
      - 'paros_media_volume:/app/media'
      - 'paros_respaldos_volume:/app/respaldos'
    expose:
      - '8000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    volumes:
      - 'paros_static_volume:/app/staticfiles:ro'
      - 'paros_media_volume:/app/media:ro'
    expose:
      - '80'
    depends_on:
      web:
        condition: service_healthy
    networks:
      - default
      - coolify

networks:
  coolify:
    external: true

volumes:
  paros_postgres_data:
  paros_static_volume:
  paros_media_volume:
  paros_respaldos_volume: